name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build (installer + exe)
        run: npm run tauri build

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/nlx-search.exe release/NLX_SEARCH-portable.exe
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            Copy-Item $_.FullName "release/NLX_SEARCH-setup.exe"
          }
          Get-FileHash release/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content release/SHA256SUMS.txt
          Get-ChildItem release

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: nlx-search-windows
          path: release/*

      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: NLX_SEARCH ${{ github.ref_name }}
          files: |
            release/NLX_SEARCH-setup.exe
            release/NLX_SEARCH-portable.exe
            release/SHA256SUMS.txt
