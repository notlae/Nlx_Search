[package]
name = "nlx-search"
version = "0.1.0"
description = "NLX_SEARCH - Windows search replacement"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
trash = "5"
base64 = "0.22"
window-vibrancy = "0.5"

[profile.release]
panic = "abort"      # a panic inside the keyboard hook must never unwind across FFI
codegen-units = 1
lto = true
opt-level = "s"
strip = true
